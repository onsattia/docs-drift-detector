[project]
name = "docs-drift-detector"
version = "0.1.0"
description = "Detects drift between documentation and the code it describes."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "pydantic>=2.13",
    "pyyaml>=6.0",
    "typer>=0.27",
]

[project.scripts]
docs-drift = "docs_drift.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docs_drift"]

[dependency-groups]
dev = [
    "mypy>=2.3",
    "pre-commit>=4.6",
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "ruff>=0.16",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF"]

[tool.mypy]
strict = true
mypy_path = "src"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=docs_drift --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
source = ["docs_drift"]
branch = true

[tool.uv]
# Only resolve releases at least two weeks old; newer releases wait until they have settled.
exclude-newer = "2026-10-01T00:00:00Z"
