schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
context: |
  Project: docs-drift-detector. Detects drift between documentation and the code it describes.
  Tech stack: Python 3.12, uv for dependencies and lockfile, pytest, ruff (lint and format), mypy (strict).
  Deployment target: scheduled batch job in CI (GitHub Actions), packaged as a container image. Not a web service.
  Conventions: conventional commits; pinned dependencies; model IDs and prompts versioned in the repo.
  Security: read-only repo tokens; no secrets in code, logs, or images; redact internal data from logs;
  only approved model endpoints for internal docs. Domain is internal documentation (GDPR applies).
  Config: sources registry (sources.yaml) maps doc folders to code repos.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
