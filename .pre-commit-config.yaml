# Hooks use the same tool versions as CI: Go 1.26.9 and golangci-lint v2.12.2.
repos:
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        language: system
        entry: sh -c 'out="$(gofmt -l "$@")"; if [ -n "$out" ]; then echo "$out"; exit 1; fi' --
        types: [go]
      - id: golangci-lint
        name: golangci-lint
        language: system
        entry: golangci-lint run ./...
        pass_filenames: false
        types: [go]
